name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Deliberately unpinned: the gate asks "does this plugin load in the Claude Code
      # people actually have", so it has to track the current CLI rather than a frozen one.
      - name: Validate plugin manifest, skills and commands
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate plugins/web-launcher --strict

      - name: Every capability-index row must point at a file that exists
        run: |
          cd plugins/web-launcher/skills/web-launcher
          grep -o 'references/[0-9][0-9]-[a-z-]*\.md' SKILL.md | sort -u > /tmp/rows
          ls references/*.md | xargs -n1 basename | sed 's|^|references/|' | sort > /tmp/files
          missing=$(comm -23 /tmp/rows /tmp/files)
          orphan=$(comm -13 /tmp/rows /tmp/files)
          if [ -n "$missing" ]; then echo "::error::SKILL.md points at missing reference(s):"; echo "$missing"; fi
          if [ -n "$orphan" ]; then echo "::error::reference file(s) absent from the capability index:"; echo "$orphan"; fi
          [ -z "$missing$orphan" ]
