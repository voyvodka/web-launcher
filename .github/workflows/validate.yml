name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Deliberately unpinned: the gate asks "does this plugin load in the Claude Code
      # people actually have", so it has to track the current CLI rather than a frozen one.
      - name: Validate plugin manifest, skills and commands
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate plugins/web-launcher --strict

      # The sibling repo had its ignore rule pinned to a literal path; a directory rename
      # stopped it matching and private files landed in a commit. This asserts the rule
      # here is doing its job rather than trusting that it is.
      - name: No maintainer-only or product docs may be tracked
        run: |
          tracked=$(git ls-files | grep -E 'references/local/|^docs/' || true)
          if [ -n "$tracked" ]; then
            echo "::error::files that must never be published are tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "ok: nothing under references/local/ or docs/ is tracked"

      - name: Every capability-index row must point at a file that exists
        run: |
          cd plugins/web-launcher/skills/web-launcher
          grep -o 'references/[0-9][0-9]-[a-z-]*\.md' SKILL.md | sort -u > /tmp/rows
          ls references/*.md | xargs -n1 basename | sed 's|^|references/|' | sort > /tmp/files
          missing=$(comm -23 /tmp/rows /tmp/files)
          orphan=$(comm -13 /tmp/rows /tmp/files)
          if [ -n "$missing" ]; then echo "::error::SKILL.md points at missing reference(s):"; echo "$missing"; fi
          if [ -n "$orphan" ]; then echo "::error::reference file(s) absent from the capability index:"; echo "$orphan"; fi
          [ -z "$missing$orphan" ]

      # Two releases shipped a version block holding the same fixes twice, under two `### Fixed`
      # headings, because separate PRs each appended to `[Unreleased]` and the release stamped both
      # without merging them. Reading the file is what caught it, months later. A duplicated heading
      # is mechanically detectable, so it is checked rather than trusted.
      - name: Changelog structure
        run: |
          python3 - <<'PY'
          import re, sys

          lines = open('CHANGELOG.md').read().split('\n')
          errors, versions, cur, seen = [], [], None, set()
          ORDER = ['Added', 'Changed', 'Deprecated', 'Removed', 'Fixed', 'Security']

          for n, line in enumerate(lines, 1):
              if line.startswith('## '):
                  cur, seen = line[3:].strip(), set()
                  versions.append((n, cur))
              elif line.startswith('### '):
                  h = line[4:].strip()
                  if h in seen:
                      errors.append(f"line {n}: '{h}' appears twice under '{cur}' — "
                                    "merge the two blocks into one")
                  seen.add(h)
                  if h not in ORDER:
                      errors.append(f"line {n}: '{h}' is not a Keep a Changelog section "
                                    f"({', '.join(ORDER)})")

          names = [v for _, v in versions]
          if '[Unreleased]' not in names:
              errors.append("no '## [Unreleased]' section — the next change has nowhere to land, "
                            "which is how entries end up appended to an already-released block")

          released = [(n, v) for n, v in versions if v != '[Unreleased]']
          for n, v in released:
              if not re.match(r'^\[\d+\.\d+\.\d+\] - \d{4}-\d{2}-\d{2}$', v):
                  errors.append(f"line {n}: '{v}' is not '[x.y.z] - YYYY-MM-DD'")

          nums = [m.group(1) for _, v in released if (m := re.match(r'^\[(\d+\.\d+\.\d+)\]', v))]
          for d in sorted({n for n in nums if nums.count(n) > 1}):
              errors.append(f"version {d} has more than one heading — one version, one block")

          # The footer is what turns each heading into a link; 0.3.1 and 0.3.2 shipped without one
          # and [Unreleased] kept comparing from 0.3.0, so the "what changed" link was wrong.
          refs = dict(m.groups() for l in lines if (m := re.match(r'^\[([^\]]+)\]:\s*(\S+)', l)))
          for d in dict.fromkeys(nums):
              if d not in refs:
                  errors.append(f"version {d} has no '[{d}]: <url>' link reference")
          if nums:
              newest = max(nums, key=lambda v: tuple(map(int, v.split('.'))))
              want = f"/compare/v{newest}...HEAD"
              if not refs.get('Unreleased', '').endswith(want):
                  errors.append(f"[Unreleased] must compare from the newest release: "
                                f"...{want} (found {refs.get('Unreleased', 'nothing')})")

          for e in errors:
              print(f"::error file=CHANGELOG.md::{e}")
          print(f"checked {len(versions)} version blocks: {'FAIL' if errors else 'ok'}")
          sys.exit(1 if errors else 0)
          PY
